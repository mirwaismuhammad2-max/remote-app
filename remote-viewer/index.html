<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RemoteApp Viewer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #111111;
    --panel: #f2f2f2;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --fg: #f2f2f2; --panel: #1d1d1d; --accent: #3b82f6; }
  }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, system-ui, sans-serif;
  }
  #setup { max-width: 420px; margin: 40px auto; padding: 16px; }
  #setup input {
    width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0;
    border-radius: 8px; border: 1px solid #999; background: var(--panel); color: var(--fg);
    font-size: 18px; text-align: center; letter-spacing: 2px;
  }
  #setup button, .app-btn, #logoutBtn {
    padding: 10px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: white; font-weight: 600; cursor: pointer;
  }
  #logoutBtn { background: #999; }
  #session { display: none; height: 100%; flex-direction: column; }
  #top-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: var(--panel); }
  #apps-bar { display: flex; gap: 8px; padding: 10px; overflow-x: auto; background: var(--panel); }
  #apps-bar .app-btn { white-space: nowrap; flex-shrink: 0; }
  #video-wrap {
    position: relative; flex: 1; overflow: hidden; background: black;
    display: flex; align-items: center; justify-content: center; touch-action: none;
  }
  video { max-width: 100%; max-height: 100%; }
  #status-bar { padding: 6px 10px; font-size: 13px; background: var(--panel); opacity: 0.8; }
  #keyboard-input { position: absolute; bottom: -100px; opacity: 0; }
</style>
</head>
<body>

<div id="setup">
  <h2>RemoteApp Viewer</h2>
  <p>Enter the pairing code shown on the phone. You only need to do this once — it'll remember after that.</p>
  <input id="pairingCode" placeholder="Pairing code" inputmode="numeric" />
  <button onclick="connect(true)">Connect</button>
  <p id="setupStatus"></p>
</div>

<div id="session">
  <div id="top-bar">
    <span>RemoteApp</span>
    <button id="logoutBtn" onclick="logout()">Log out</button>
  </div>
  <div id="apps-bar"></div>
  <div id="video-wrap">
    <video id="remoteVideo" autoplay playsinline></video>
    <input id="keyboard-input" />
  </div>
  <div id="status-bar">Not connected</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ====== PASTE YOUR firebaseConfig OBJECT FROM THE FIREBASE CONSOLE HERE ======
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};
// ==============================================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let pc, dataChannel, pairingCode = '';
let sessionDoc, candidatesUnsub, answerUnsub;
const videoEl = document.getElementById('remoteVideo');
const statusBar = document.getElementById('status-bar');
const appsBar = document.getElementById('apps-bar');
const STORAGE_KEY = 'remoteapp_pairing_code';

function connect(isManual) {
  const codeInput = document.getElementById('pairingCode');
  pairingCode = (isManual ? codeInput.value.trim() : localStorage.getItem(STORAGE_KEY)) || '';

  if (!pairingCode) {
    document.getElementById('setupStatus').textContent = 'Enter the pairing code shown on the phone.';
    return;
  }

  document.getElementById('setup').style.display = 'none';
  document.getElementById('session').style.display = 'flex';
  setStatus('Connecting...');

  sessionDoc = db.collection('sessions').doc(pairingCode);

  sessionDoc.collection('presence').doc('viewer').set({ online: true, ts: Date.now() })
    .then(() => setStatus('Waiting for phone to start sharing...'))
    .catch(e => setStatus('Error: ' + e.message));

  setupPeerConnection();

  answerUnsub = sessionDoc.onSnapshot(async (snap) => {
    const data = snap.data();
    if (data && data.offer && pc.signalingState === 'stable' && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription({ type: 'offer', sdp: data.offer });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await sessionDoc.update({ answer: answer.sdp });
      setStatus('Answer sent. Waiting for video...');
    }
  }, (e) => setStatus('Error: ' + e.message));

  candidatesUnsub = sessionDoc.collection('hostCandidates').onSnapshot((snap) => {
    snap.docChanges().forEach((change) => {
      if (change.type === 'added') {
        const d = change.doc.data();
        pc.addIceCandidate({ sdpMid: d.sdpMid, sdpMLineIndex: d.sdpMLineIndex, candidate: d.candidate })
          .catch(e => console.warn('ICE add failed', e));
      }
    });
  });

  localStorage.setItem(STORAGE_KEY, pairingCode);
}

function logout() {
  if (candidatesUnsub) candidatesUnsub();
  if (answerUnsub) answerUnsub();
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

function setupPeerConnection() {
  pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      sessionDoc.collection('viewerCandidates').add({
        sdpMid: event.candidate.sdpMid,
        sdpMLineIndex: event.candidate.sdpMLineIndex,
        candidate: event.candidate.candidate
      });
    }
  };

  pc.ontrack = (event) => {
    videoEl.srcObject = event.streams[0];
    setStatus('Live.');
  };

  pc.ondatachannel = (event) => {
    dataChannel = event.channel;
    wireDataChannel();
  };
}

function wireDataChannel() {
  dataChannel.onopen = () => setStatus('Control channel open.');
  dataChannel.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.cmd === 'app-list') renderAppList(msg.apps);
  };
}

function send(obj) {
  if (dataChannel && dataChannel.readyState === 'open') {
    dataChannel.send(JSON.stringify(obj));
  }
}

function renderAppList(apps) {
  appsBar.innerHTML = '';
  apps.forEach(app => {
    const openBtn = document.createElement('button');
    openBtn.className = 'app-btn';
    openBtn.textContent = 'Open ' + app.label;
    openBtn.onclick = () => send({ cmd: 'launch', packageName: app.packageName });

    const closeBtn = document.createElement('button');
    closeBtn.className = 'app-btn';
    closeBtn.textContent = 'Close ' + app.label;
    closeBtn.onclick = () => send({ cmd: 'close', packageName: app.packageName });

    appsBar.appendChild(openBtn);
    appsBar.appendChild(closeBtn);
  });
}

function setStatus(text) { statusBar.textContent = text; }

let touchStart = null;

function videoCoords(clientX, clientY) {
  const rect = videoEl.getBoundingClientRect();
  const scaleX = videoEl.videoWidth / rect.width;
  const scaleY = videoEl.videoHeight / rect.height;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

const videoWrap = document.getElementById('video-wrap');

videoWrap.addEventListener('pointerdown', (e) => {
  touchStart = { ...videoCoords(e.clientX, e.clientY), time: Date.now() };
});

videoWrap.addEventListener('pointerup', (e) => {
  if (!touchStart) return;
  const end = videoCoords(e.clientX, e.clientY);
  const dx = end.x - touchStart.x;
  const dy = end.y - touchStart.y;
  const dist = Math.hypot(dx, dy);
  const duration = Date.now() - touchStart.time;

  if (dist < 10) {
    if (duration > 500) send({ cmd: 'longPress', x: touchStart.x, y: touchStart.y });
    else send({ cmd: 'tap', x: touchStart.x, y: touchStart.y });
  } else {
    send({ cmd: 'swipe', x1: touchStart.x, y1: touchStart.y, x2: end.x, y2: end.y, durationMs: duration });
  }
  touchStart = null;
});

let lastTap = 0;
videoWrap.addEventListener('pointerup', () => {
  const now = Date.now();
  if (now - lastTap < 300) document.getElementById('keyboard-input').focus();
  lastTap = now;
});

document.getElementById('keyboard-input').addEventListener('input', (e) => {
  send({ cmd: 'type', text: e.target.value });
});

window.addEventListener('load', () => {
  if (localStorage.getItem(STORAGE_KEY)) connect(false);
});
</script>
</body>
</html>
